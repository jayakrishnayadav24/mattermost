name: Deploy Mattermost to EC2 (SSM)

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: lets this workflow request a short-lived AWS credential with no
# stored access keys. "id-token: write" is required for the OIDC handshake.
permissions:
  id-token: write
  contents: read

concurrency:
  group: mattermost-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  SSM_BUCKET: ${{ vars.SSM_BUCKET }}
  TF_VAR_ssm_transfer_bucket: ${{ vars.SSM_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC subject and role
        run: |
          echo "repo:  ${GITHUB_REPOSITORY}"
          echo "ref:   ${GITHUB_REF}"
          echo "event: ${GITHUB_EVENT_NAME}"
          echo "=> token sub will be: repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF}"
          echo "role-to-assume var: ${{ vars.AWS_ROLE_ARN }}"
          echo "(trust policy sub pattern must match: repo:jayakrishnayadav24/mattermost:*)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- Terraform: provision / reconcile infra (idempotent) ----------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=mattermost/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -var "region=${AWS_REGION}"

      - name: Capture Terraform outputs
        id: tf
        working-directory: terraform
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform output -raw public_ip)"     >> "$GITHUB_OUTPUT"

      # ---- Wait until the instance is registered & online in SSM --------
      - name: Wait for SSM to register the instance
        run: |
          id="${{ steps.tf.outputs.instance_id }}"
          echo "Waiting for $id to be a managed, online SSM instance..."
          for i in $(seq 1 40); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$id" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "None")
            echo "attempt $i: PingStatus=$status"
            [ "$status" = "Online" ] && exit 0
            sleep 15
          done
          echo "Instance did not come online in SSM in time" >&2
          exit 1

      # ---- Ansible over SSM: install Docker + run the stack -------------
      - name: Setup Python & Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible>=9" boto3 botocore
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install Session Manager plugin
        run: |
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb

      - name: Ansible Deploy (over SSM)
        working-directory: ansible
        env:
          TARGET_INSTANCE_ID: ${{ steps.tf.outputs.instance_id }}
          SSM_BUCKET: ${{ env.SSM_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook playbook.yml \
            -e "mysql_root_password=${{ secrets.MM_ROOT_PW }}" \
            -e "mysql_password=${{ secrets.MM_DB_PW }}" \
            -e "site_url=http://${{ steps.tf.outputs.public_ip }}"

      - name: Summary
        run: |
          echo "### Mattermost deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: \`${{ steps.tf.outputs.instance_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: http://${{ steps.tf.outputs.public_ip }}" >> "$GITHUB_STEP_SUMMARY"
